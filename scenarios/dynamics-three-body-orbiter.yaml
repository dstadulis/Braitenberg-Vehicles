name: Three-body orbiter chaos
description: >-
  Six Vehicle 4a Orbiters launched from the southern saddle midpoint [80, 59] at headings
  differing by just 2 degrees (84 to 96 deg), alongside a symmetric pair of Vehicle 4b
  Deciders straddling the symmetry axis. Tiny angular perturbations split trajectories onto
  distinct lamp limit cycles, figure-eight loops, and three-lamp chaotic tours. Press D in
  the window to view the live flow field and polar phase portrait.

