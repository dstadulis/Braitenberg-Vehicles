      position: [50, 21]           # in its pen, facing the fence
      heading: 90
  - vehicle:
      definition: ../vehicles/vehicle14-carrier.yaml
      position: [33, 47]           # on its circle round [50, 47], a quarter lap from the pen
      heading: 270

