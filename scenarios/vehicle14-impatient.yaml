name: Impatient
description: >-
  The impatient vehicle waits in its pen for a carrier that brings something sweet once a lap.
  Once it has learned that the carrier comes back and brings food, it taps at nothing every now
  and then while it waits, as if that could hasten it.

world: ../worlds/doorstep.yaml

