name: Orchard
description: Two red berry bushes and two blue-and-yellow stones at the corners of a square. Berries are sweet for the first 600 s of every 1200, honey on the stones for the other 600 s; sweet is smelled only close by (Vehicle 10).

arena:
  width: 100
  height: 100
  edges: wrap

stimuli:
  red:                      # the berry bushes, seen from afar
    sources:
      - {position: [25, 25], intensity: 10, falloff: 15}
      - {position: [75, 75], intensity: 10, falloff: 15}
  blue:                     # the stones are blue...
    sources:
      - {position: [75, 25], intensity: 10, falloff: 15}
      - {position: [25, 75], intensity: 10, falloff: 15}
  yellow:                   # ...and yellow
    sources:
      - {position: [75, 25], intensity: 10, falloff: 15}
      - {position: [25, 75], intensity: 10, falloff: 15}
  sweet:                    # smelled within about 6 units
    sources:
      - {position: [25, 25], intensity: 10, falloff: 4, schedule: {period: 1200, on_at: 0, off_at: 600}}
      - {position: [75, 75], intensity: 10, falloff: 4, schedule: {period: 1200, on_at: 0, off_at: 600}}
      - {position: [75, 25], intensity: 10, falloff: 4, schedule: {period: 1200, on_at: 600, off_at: 1200}}
      - {position: [25, 75], intensity: 10, falloff: 4, schedule: {period: 1200, on_at: 600, off_at: 1200}}
