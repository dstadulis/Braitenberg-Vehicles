name: Fork road
description: >-
  A looping road that forks in two lanes round a divider (Vehicle 14). A narrow stem centers a
  vehicle before every fork. A yellow post marks the fork, a blue mark and a red one the entrances
  of the upper and lower lanes, and food lies in the upper lane, three quarters of the time.
  Nothing at the fork says where the food is.

arena:
  width: 100
  height: 40
  edges: wrap

obstacles:
  # The road's outer walls.
  - box: {position: [50, 1], length: 100, width: 2}
  - box: {position: [50, 39], length: 100, width: 2}
  # The stem, y 13 to 27, from x 80 round to x 14: two boxes on each side, since a box cannot
  # cross the wrapping edge.
  - box: {position: [90, 7.5], length: 20, width: 11}
  - box: {position: [7, 7.5], length: 14, width: 11}
  - box: {position: [90, 32.5], length: 20, width: 11}
  - box: {position: [7, 32.5], length: 14, width: 11}
  # The divider, x 34 to 70, y 12 to 28, with a pointed nose and tail.
  - box: {position: [52, 20], length: 36, width: 16}
  - box: {position: [34, 20], length: 11.3, width: 11.3, heading: 45}
  - box: {position: [70, 20], length: 11.3, width: 11.3, heading: 45}
  # Slopes from the stem into each lane, so that nothing is caught in the corners.
  - box: {position: [23, 32.5], length: 21.1, width: 2, heading: 31.4}
  - box: {position: [23, 7.5], length: 21.1, width: 2, heading: -31.4}
  # Funnels that lead each lane back into the stem.
  - box: {position: [75, 32.5], length: 18, width: 2, heading: -38}
  - box: {position: [75, 7.5], length: 18, width: 2, heading: 38}

stimuli:
  yellow:           # the post at the fork, at the tip of the nose
    sources:
      - position: [28, 20]
        intensity: 10
        falloff: 8
  blue:             # the mark at the entrance of the upper lane
    sources:
      - position: [42, 33]
        intensity: 10
        falloff: 5
  red:              # the mark at the entrance of the lower lane
    sources:
      - position: [42, 7]
        intensity: 10
        falloff: 5
  food:             # in the upper lane, there three quarters of the time
    sources:
      - position: [52, 33]
        intensity: 10
        falloff: 4
        schedule: {period: 120, on_at: 0, off_at: 90}
  proximity:        # walls, for infrared
    sources: []
    surfaces:
      intensity: 10
      falloff: 2
