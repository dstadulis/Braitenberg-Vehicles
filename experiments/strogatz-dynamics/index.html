<!DOCTYPE html>
<html lang="en" data-theme="cosmic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Braitenberg × Strogatz × Shannon — Complex Dynamics Showcase</title>
<noscript><meta http-equiv="refresh" content="0; url=../../index.html"></noscript>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #040613;
    color: #eef2ff;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 580px;
    background: #090e24;
    border: 1px solid rgba(56, 189, 248, 0.4);
    border-radius: 16px;
    padding: 28px 32px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.6);
  }
  h1 { font-size: 1.2rem; margin: 0 0 10px; }
  p { color: #94a3c8; font-size: 0.92rem; line-height: 1.5; margin: 0 0 18px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  a {
    display: inline-block;
    text-decoration: none;
    color: #eef2ff;
    background: rgba(56, 189, 248, 0.2);
    border: 1px solid rgba(56, 189, 248, 0.6);
    padding: 9px 15px;
    border-radius: 10px;
    font-size: 0.86rem;
    font-weight: 600;
  }
  a.alt {
    background: rgba(26, 38, 84, 0.72);
    border-color: rgba(99, 132, 255, 0.3);
  }
</style>
<script>
  (function () {
    var suffix = (window.location.search || "") + (window.location.hash || "");
    var target = "../../index.html" + suffix;
    document.addEventListener("DOMContentLoaded", function () {
      var link = document.getElementById("fallbackShowcaseLink");
      if (link && suffix) link.href = target;
    });
    try { window.location.replace(target); } catch (e) {}
  })();
</script>
</head>
<body>
  <main class="card">
    <h1>Braitenberg × Strogatz × Shannon — Complex Dynamics</h1>
    <p>Redirecting to the 60fps Complex Dynamics Cinema, 4K Phase-Space Galleries, and Live Tri-Panel Connectome Laboratory…</p>
    <div class="actions">
      <a id="fallbackShowcaseLink" href="../../index.html">▶ Open Complex Dynamics Showcase</a>
      <a class="alt" href="explorer.html">⚡ Open Standalone Tri-Panel Lab (explorer.html)</a>
    </div>
  </main>
</body>
</html>
